<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <!-- Warm oat cream card background -->
  <rect width="600" height="400" fill="#F7F2EA"/>
  <rect x="20" y="20" width="560" height="360" rx="16" fill="#FAF6F0" stroke="#EDE4DA" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Subtle decorative stamp circle -->
  <circle cx="300" cy="180" r="72" fill="#F0E6D8" opacity="0.6"/>
  
  <!-- Handcrafted bakery icon illustration (flour sack / bread loaf) -->
  <g stroke="#934A24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bread batard outline -->
    <path d="M230 200 C230 150, 370 150, 370 200 C370 215, 230 215, 230 200 Z" fill="#FDFBF7"/>
    <!-- Scores across the loaf -->
    <path d="M260 175 Q272 188 280 202"/>
    <path d="M292 170 Q302 185 308 202"/>
    <path d="M324 175 Q332 188 338 202"/>
    
    <!-- Wheat sprig accent -->
    <path d="M300 120 V145"/>
    <path d="M293 125 C295 120, 305 120, 300 132"/>
    <path d="M307 125 C305 120, 295 120, 300 132"/>
    <path d="M293 135 C295 130, 305 130, 300 142"/>
    <path d="M307 135 C305 130, 295 130, 300 142"/>
  </g>
  
  <!-- Tasteful label -->
  <text x="300" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#5C4E48" text-transform="uppercase">Fresh Daily Surplus</text>
  <text x="300" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#82746E">Photo coming with tonight's bake</text>
</svg>
